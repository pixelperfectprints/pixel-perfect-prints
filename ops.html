<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Perfect Prints — Ops</title>
<script src="firebase-config.js"></script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0518'/%3E%3Cpath d='M16 6l9 15H7z' fill='none' stroke='%23ff2ea6' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='18' r='2.6' fill='%2300e5ff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0518; --bg2:#100a24; --card:#150d2e; --card2:#1c1240;
  --fg:#eae6ff; --mut:#9a8fc4; --bord:#2c1e5c;
  --acc:#00e5ff; --ok:#b6ff2e; --warn:#ffd12e; --bad:#ff2e5c;
  --neon:#ff2ea6;
  --grad:linear-gradient(92deg,#ff2ea6,#7a2eff 55%,#00e5ff);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:'Rajdhani',system-ui,sans-serif;font-size:15.5px;padding-bottom:60px}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:
  radial-gradient(ellipse 60% 40% at 85% -5%,rgba(255,46,166,.13),transparent 60%),
  radial-gradient(ellipse 50% 35% at 8% 20%,rgba(0,229,255,.08),transparent 60%),
  repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.012) 3px 4px)}
header{background:rgba(11,5,24,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--bord);box-shadow:0 1px 24px rgba(255,46,166,.12);padding:12px 18px;position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:17px;font-family:'Orbitron';font-weight:900;text-transform:uppercase;letter-spacing:.05em;flex:1}
header h1 b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sync{font-size:12px;padding:3px 10px;border-radius:12px;background:var(--card2);color:var(--mut);font-weight:600}
.sync.on{color:var(--ok);text-shadow:0 0 8px rgba(182,255,46,.5)}.sync.err{color:var(--bad)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:none;color:var(--mut);padding:8px 12px;cursor:pointer;font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;border-bottom:2px solid transparent}
nav button.act{color:var(--cyan);border-color:var(--cyan);text-shadow:0 0 10px rgba(0,229,255,.6)}
nav button:hover{color:var(--fg)}
main{max-width:1020px;margin:0 auto;padding:16px}
.bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.bar input,.bar select,.bar textarea{background:var(--card2);border:1px solid var(--bord);color:var(--fg);padding:8px 10px;border-radius:8px;font-size:14px;font-family:'Rajdhani';font-weight:500}
.bar input:focus,.bar select:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 12px rgba(0,229,255,.22)}
.bar input,.bar select{flex:1;min-width:120px}
.btn{background:var(--grad);color:#16081f;border:1px solid rgba(255,255,255,.35);padding:8px 16px;border-radius:8px;cursor:pointer;font-weight:800;font-size:14px;font-family:'Rajdhani';text-transform:uppercase;letter-spacing:.06em;box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 2px 12px rgba(122,46,255,.35);transition:transform .1s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 0 18px rgba(255,46,166,.5),0 4px 16px rgba(0,0,0,.3)}{box-shadow:0 0 18px rgba(255,46,166,.45)}
.btn.ghost{background:var(--card2);color:var(--cyan);border:1px solid var(--bord)}
.btn.ghost:hover{border-color:var(--cyan);box-shadow:none}
.btn.danger{background:var(--bad);color:#fff}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bord);border-radius:12px;padding:14px;transition:border-color .15s;overflow:hidden}
.card:hover{border-color:#3d2b78}
.card h3{font-size:15px;margin-bottom:6px;word-break:break-word;font-family:'Orbitron';font-weight:700;letter-spacing:.02em}
.card .meta{color:var(--mut);font-size:12.5px;margin-bottom:8px;font-weight:500}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;margin-right:4px;text-transform:uppercase;letter-spacing:.05em}
.b-ok{background:rgba(182,255,46,.12);color:var(--ok)}.b-warn{background:rgba(255,209,46,.12);color:var(--warn)}.b-bad{background:rgba(255,46,92,.14);color:var(--bad)}.b-info{background:rgba(0,229,255,.12);color:var(--cyan)}
.stockline{display:flex;justify-content:space-between;padding:4px 0;font-size:14px;font-weight:500}
.stockline b{font-size:15px}
.actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.actions button{flex:0 1 auto;min-width:86px;background:#26204e;border:1px solid #4a3d85;color:#f0edff;padding:7px 10px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:700;white-space:nowrap;transition:background .12s,border-color .12s}
.actions button:hover{border-color:var(--cyan);box-shadow:0 0 10px rgba(0,229,255,.2)}
.note{background:var(--card);border:1px solid var(--bord);border-radius:12px;padding:12px;margin-bottom:10px}
.note .meta{color:var(--mut);font-size:12px;margin-top:6px;display:flex;justify-content:space-between}
summary{cursor:pointer;font-size:13px;color:var(--mut);margin:4px 0 8px}
details select,details input{background:var(--card2);border:1px solid var(--bord);color:var(--fg);padding:4px 8px;border-radius:6px;margin:0 4px}
.empty{color:var(--mut);text-align:center;padding:30px;border:1px dashed var(--bord);border-radius:12px;font-weight:500}
#login{max-width:400px;margin:60px auto;background:var(--card);border:1px solid var(--bord);border-radius:14px;padding:24px;box-shadow:0 0 50px rgba(255,46,166,.14)}
#login h2{font-family:'Orbitron';text-transform:uppercase;letter-spacing:.04em}
#login input{width:100%;margin-bottom:10px;background:var(--card2);border:1px solid var(--bord);color:var(--fg);padding:10px;border-radius:8px;font-size:14px;font-family:'Rajdhani';font-weight:500}
#login input:focus{outline:none;border-color:var(--cyan)}
#login .btn{width:100%}
.err{background:rgba(255,46,92,.12);color:#ff8fb0;padding:10px;border-radius:8px;margin:10px 0;font-size:13px}
.mut{color:var(--mut);font-size:13px;font-weight:500}
.k{color:var(--cyan)}
#prodform{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#prodform label{font-size:12px;color:var(--mut);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.08em}
#prodform input,#prodform textarea{width:100%;background:var(--card2);border:1px solid var(--bord);color:var(--fg);padding:8px;border-radius:8px;font-size:14px;font-family:'Rajdhani'}
#prodform textarea{height:60px;resize:vertical}
#setup textarea{width:100%;height:110px;background:var(--card2);color:var(--fg);border:1px solid var(--bord);border-radius:8px;padding:10px;font-family:monospace;font-size:12px;margin:10px 0}
@media(max-width:600px){.cards{grid-template-columns:1fr}#prodform{grid-template-columns:1fr}}

/* filament table dashboard */
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--bord);border-radius:10px;padding:12px 14px}
.stat .k{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.stat .v{font-size:21px;font-weight:700;margin-top:3px;font-family:'Orbitron'}
.stat .n{font-size:11px;color:var(--mut);margin-top:2px}
.stat.ok .v{color:var(--ok)} .stat.warn .v{color:var(--warn)} .stat.bad .v{color:var(--bad)}
.tbl-wrap{background:var(--card);border:1px solid var(--bord);border-radius:10px;overflow:auto;margin-bottom:14px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--card2);text-align:left;padding:9px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);position:sticky;top:0;white-space:nowrap}
td{padding:8px 12px;border-top:1px solid var(--bord);white-space:nowrap}
tr:hover td{background:var(--card2)}
.sw{display:inline-block;width:13px;height:13px;border-radius:4px;border:1px solid rgba(255,255,255,.25);vertical-align:-2px;margin-right:7px}
.lvbar{width:80px;height:6px;background:#241a4d;border-radius:3px;display:inline-block;overflow:hidden;vertical-align:middle}
.lvbar i{display:block;height:100%;border-radius:3px}
.who{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:700}
.who.J{background:rgba(0,229,255,.13);color:var(--cyan)}
.who.B{background:rgba(255,46,166,.13);color:var(--neon)}
.who.S{background:rgba(154,143,196,.15);color:var(--mut)}
.flag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:700}
.flag.ok{background:rgba(182,255,46,.13);color:var(--ok)}
.flag.low{background:rgba(255,209,46,.13);color:var(--warn)}
.flag.out{background:rgba(255,46,92,.14);color:var(--bad)}
.flag.inc{background:rgba(0,229,255,.13);color:var(--cyan)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.muted{color:var(--mut)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.panel{background:var(--card);border:1px solid var(--bord);border-radius:10px;padding:14px}
.panel h3{font-size:12px;margin-bottom:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.mv{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--bord);font-size:12.5px}
.mv:first-of-type{border-top:none}
.mv .when{color:var(--mut);width:64px;flex-shrink:0}
.mv .what{flex:1;padding-right:8px}
.mv .amt{font-variant-numeric:tabular-nums;font-weight:700}
.mv .amt.neg{color:var(--bad)} .mv .amt.pos{color:var(--ok)}
.form-row{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;align-items:center}
.form-row input,.form-row select{background:var(--card2);border:1px solid var(--bord);border-radius:7px;padding:7px 10px;color:var(--fg);font-size:13px;font-family:'Rajdhani'}
.log{max-height:260px;overflow:auto}
@media(max-width:900px){.stats{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:1fr}}

/* incoming stat hover popout */
.stat.inc-card,.stat.low-card{position:relative;cursor:help}
.inc-pop{position:absolute;top:calc(100% + 10px);left:0;z-index:60;background:var(--card2);border:1px solid var(--cyan);border-radius:10px;padding:12px 14px;box-shadow:0 10px 34px rgba(0,0,0,.55);width:360px;max-width:82vw;max-height:300px;overflow:auto;opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .16s,transform .16s,visibility .16s}
.stat.inc-card:hover .inc-pop,.stat.inc-card:focus .inc-pop,.stat.low-card:hover .inc-pop,.stat.low-card:focus .inc-pop{opacity:1;visibility:visible;transform:translateY(0)}
.inc-row{padding:7px 0;border-top:1px solid var(--bord);font-size:12.5px}
.inc-row:first-of-type{border-top:none}
.inc-row b{font-family:'Orbitron';font-size:12px}
.inc-note{color:var(--mut);font-size:11.5px;margin-top:2px}

/* pokeball colour popup in filament table */
.pbcell{position:relative;cursor:help}
.pbflag{background:rgba(255,46,166,.13);color:var(--neon);font-size:10px}
.pb-pop{position:absolute;left:104%;top:-4px;z-index:70;background:var(--card2);border:1px solid var(--neon);border-radius:10px;padding:10px 12px;box-shadow:0 10px 34px rgba(0,0,0,.6);width:300px;max-width:70vw;max-height:340px;overflow:auto;opacity:0;visibility:hidden;transform:translateX(-6px);transition:opacity .16s,transform .16s,visibility .16s}
.pbcell:hover .pb-pop{opacity:1;visibility:visible;transform:translateX(0)}
.pb-row{padding:4px 0;border-top:1px solid var(--bord);font-size:12px;font-weight:600}
.pb-row:first-of-type{border-top:none}
@media(max-width:700px){.pb-pop{left:auto;right:0;width:220px}}

/* filament tighten */
.fil-filters{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.fil-filters select{background:var(--card2);border:1px solid var(--bord);color:var(--fg);padding:5px 8px;border-radius:7px;font-size:12px;font-family:'Rajdhani';cursor:pointer}
.fil-filters select:focus{outline:none;border-color:var(--cyan)}
.fil-hide{font-size:12.5px;color:var(--mut);display:inline-flex;align-items:center;gap:5px;cursor:pointer;font-weight:600}
.fil-hide input{accent-color:var(--neon);cursor:pointer}
.fil-count{font-size:11.5px}
.stats{gap:8px;margin-bottom:10px}
.stat{padding:9px 12px}
.stat .v{font-size:18px}
/* incoming scrolling banner — two rows, all items visible within ~8s */
.fil-banner{overflow:hidden;border:1px solid var(--bord);border-radius:9px;background:var(--card);margin-bottom:14px}
.fil-banner-head{display:flex;gap:10px;align-items:center;padding:7px 14px 0}
.fil-banner-rows{display:grid}
.fil-track{display:flex;gap:34px;width:max-content;padding:7px 14px;animation:filslide 16s linear infinite}
.fil-track.rev{animation-direction:reverse}
.fil-inc{white-space:nowrap;font-size:13px;color:var(--fg);font-weight:500;cursor:help}
.fil-inc b{color:var(--cyan);font-family:'Orbitron';font-size:12.5px}
@keyframes filslide{to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){.fil-track{animation:none}}

/* tab headers */
.tabhead{display:flex;align-items:baseline;gap:12px;margin:2px 0 14px;padding-bottom:8px;border-bottom:1px solid var(--bord)}
.tabhead h2{font-family:'Orbitron';font-size:17px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin:0}
.tabhead h2 b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.tabhead .n{color:var(--neon);font-family:'Orbitron';font-size:12px;font-weight:700;letter-spacing:.16em}
.tabhead .sub{color:var(--mut);font-size:13px;font-weight:500;margin-left:auto}

/* bar buttons: never squeezed by flexing inputs */
.bar .btn{flex:0 0 auto;white-space:nowrap}

/* stock tab */
.stbtn{background:#26204e;border:1px solid #4a3d85;color:#f0edff;padding:3px 9px;border-radius:6px;cursor:pointer;font-size:11.5px;font-weight:700;white-space:nowrap}
.stbtn:hover{border-color:var(--cyan);box-shadow:0 0 8px rgba(0,229,255,.2)}
.stinput{width:56px;background:var(--card2);border:1px solid var(--bord);color:var(--fg);padding:3px 6px;border-radius:6px;font-size:12px;font-weight:600}
.stinput:focus{outline:none;border-color:var(--cyan)}

/* ops bot */
.botwrap{max-width:760px}
.botlog{background:var(--card);border:1px solid var(--bord);border-radius:12px;padding:14px;height:420px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.bmsg{max-width:86%;padding:9px 13px;border-radius:12px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.bmsg.user{align-self:flex-end;background:linear-gradient(92deg,rgba(122,46,255,.35),rgba(0,229,255,.25));border:1px solid var(--bord)}
.bmsg.bot{align-self:flex-start;background:var(--card2);border:1px solid var(--bord)}
.bmsg.err{align-self:flex-start;background:rgba(255,46,92,.1);border:1px solid var(--bad);color:#ff9ab0}
.bbar{display:flex;gap:8px;margin-top:10px}
.bbar input{flex:1;background:var(--card2);border:1px solid var(--bord);color:var(--fg);padding:10px 14px;border-radius:10px;font-size:14px;font-family:'Rajdhani';font-weight:500;outline:none}
.bbar input:focus{border-color:var(--cyan)}
.bchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.bchip{background:var(--card2);border:1px solid var(--bord);color:var(--cyan);border-radius:14px;padding:4px 12px;font-size:12px;font-weight:600;cursor:pointer}
.bchip:hover{border-color:var(--cyan)}
.bmsg b{color:var(--cyan)}
</style>
</head>
<body>
<header id="hdr" style="display:none">
  <h1>🖨️ PIXEL <b>PERFECT</b> PRINTS — OPS</h1>
  <nav>
    <button data-t="filament">Filament</button>
    <button data-t="jobs">Jobs</button>
    <button data-t="assign">Sliced jobs</button>
    <button data-t="files">Files</button>
    <button data-t="stock">Stock</button>
    <button data-t="xmas">Christmas</button>
    <button data-t="costs">Costs</button>
    <button data-t="bot">Bot</button>
    <button data-t="queue">Queue</button>
    <button data-t="products">Products</button>
    <button data-t="enquiries">Enquiries</button>
    <button data-t="orders">Orders</button>
    <button data-t="notes">Notes</button>
  </nav>
  <span class="sync" id="sync">connecting…</span>
  <span class="mut" id="userbox"></span>
  <a class="btn ghost" style="padding:5px 12px;text-decoration:none;text-transform:uppercase" href="index.html" target="_blank">⬈ View site</a>
  <button class="btn ghost" style="padding:4px 10px" onclick="logout()">Log out</button>
</header>
<main id="app" style="display:none"></main>
<div id="login" style="display:none">
  <h2>Employee access</h2>
  <p class="mut" style="margin:8px 0 14px">Jammin &amp; James only.</p>
  <input id="l-email" type="email" placeholder="you@example.com">
  <input id="l-pass" type="password" placeholder="Password">
  <div class="err" id="lerr" style="display:none"></div>
  <button class="btn" onclick="doLogin()">Log in</button>
  <p class="mut" style="margin-top:10px">First time? <a href="#" class="k" onclick="doSignup();return false">create it here</a> (uses the email + password above).<br>Forgot your password? <a href="#" class="k" onclick="doReset();return false">email me a reset link</a>.</p>
</div>
<div id="setup" style="display:none">
  <h2>⚡ Firebase config needed</h2>
  <p class="mut">Paste your firebaseConfig below (once per device), then log in.</p>
  <textarea id="cfg" style="width:100%;height:110px;background:var(--card2);color:var(--fg);border:1px solid var(--bord);border-radius:8px;padding:10px;font-family:monospace;font-size:12px;margin:10px 0" placeholder='{"apiKey":"...","databaseURL":"..."}'></textarea>
  <div class="err" id="cfgerr" style="display:none"></div>
  <button class="btn" onclick="saveCfg()">Save</button>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
<script>
const LS='printops_cfg';let db=null,storage=null,state={filament:{},jobs:{},orders:{},notes:{},assign:{},files:{},products:{},enquiries:{}};
const tab=()=>localStorage.getItem('printops_tab')||'filament';
const me=()=>{const e=firebase.auth().currentUser?.email||'';return /^james/i.test(e)?'James':'Jammin';};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const $=id=>document.getElementById(id);
function show(which){['login','setup','hdr','app'].forEach(i=>$(i).style.display=i===which||((which==='hdr')&&i==='app')?'':'none');}

/* ---------- config ---------- */
function saveCfg(){
  const errEl=$('cfgerr');errEl.style.display='none';
  const raw=$('cfg').value.trim();
  try{
    const a=raw.indexOf('{'),b=raw.lastIndexOf('}');
    if(a<0||b<=a)throw new Error('No { } braces found — paste the whole firebaseConfig block.');
    const c=JSON.parse(raw.slice(a,b+1).replace(/'/g,'"').replace(/([{,]\s*)([A-Za-z0-9_]+)\s*:/g,'$1"$2":').replace(/,(\s*[}\]])/g,'$1'));
    if(!c.databaseURL)throw new Error('Missing databaseURL — create the Realtime Database first, then re-copy the config.');
    localStorage.setItem(LS,JSON.stringify(c));boot(c);
  }catch(e){errEl.textContent='⚠ '+(e.message||e);errEl.style.display='block';}
}

/* ---------- auth ---------- */
function doLogin(){
  const e=$('lerr');e.style.display='none';
  firebase.auth().signInWithEmailAndPassword($('l-email').value.trim(),$('l-pass').value)
    .catch(err=>{e.textContent='⚠ '+err.message;e.style.display='block';});
}
function doSignup(){
  const e=$('lerr');e.style.display='none';
  firebase.auth().createUserWithEmailAndPassword($('l-email').value.trim(),$('l-pass').value)
    .catch(err=>{e.textContent='⚠ '+err.message;e.style.display='block';});
}
function logout(){firebase.auth().signOut();}
function doReset(){
  const e=$('lerr');e.style.display='none';
  const email=$('l-email').value.trim();
  if(!email){e.textContent='⚠ Type your email above first, then click reset.';e.style.display='block';return;}
  firebase.auth().sendPasswordResetEmail(email).then(()=>{

function boot(cfg){
  firebase.initializeApp(cfg);
  db=firebase.database();storage=firebase.storage();
  firebase.auth().onAuthStateChanged(u=>{
    if(u){
      $('userbox').textContent=u.email+' ('+me()+')';

function up(path,val){return db.ref('ops/'+path).set(val);}
function upd(path,val){return db.ref('ops/'+path).update(val);}
const FIL_RECEIVED=JSON.parse((()=>{try{return localStorage.getItem('fil_received')||'[]'}catch{return '[]'}})());
window.filRecvAll=async()=>{
  if(!FIL_INCOMING.length)return alert('Nothing incoming to receive.');
  if(!confirm('Receive all '+FIL_INCOMING.length+' incoming items into stock?'))return;
  let done=0;
  for(const x of FIL_INCOMING){ if(FIL_RECEIVED.includes(x.name))continue; try{await window.filRecv(x.name,true);done++;}catch(e){alert('Failed '+x.name+': '+e.message);} }
  if(done)alert('Received '+done+' items.');
  render();
};
window.filRecv=async(name,silent)=>{
  // add incoming kg to the matching filament record (owner Jammin)
  const item=FIL_INCOMING.find(x=>x.name===name); if(!item)return;
  const id=String(name).replace(/[^\w ]/g,'');
  const cur=(state.filament&&state.filament[id])||{};
  const curKg=cur.kg!=null?+cur.kg:0, curSp=cur.spools!=null?+cur.spools:0;
  const newKg=Math.round((curKg+item.kg)*1000)/1000, newSp=curSp+Math.round(item.kg);
  await upd('filament/'+id,{kg:newKg,spools:newSp,owner:'J',name:item.name,type:item.type||cur.type||'PLA Matte'});
  if(!FIL_RECEIVED.includes(name))FIL_RECEIVED.push(name);
  localStorage.setItem('fil_received',JSON.stringify(FIL_RECEIVED));
  await add('fmoves',{d:new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short'}),who:'J',
    what:'received incoming — '+name+' (+'+item.kg+'kg)',amt:Math.round(item.kg*1000),ts:new Date().toISOString()});
  if(!silent){render();}
};

function renderFilament(){
  const fget=(k,d)=>{try{return localStorage.getItem(k)||d}catch{return d}};
  const curOwner=fget('fil_owner','all'), curSeries=fget('fil_series','all'), curStatus=fget('fil_status','all');
  const hideEmpty=fget('fil_hideEmpty','1')==='1';
  const key=n=>String(n).replace(/[^\w ]/g,'');
  const liveBy={};
  Object.entries(state.filament||{}).forEach(([id,f])=>liveBy[id]=f);
  const resolve=m=>{
    const f=liveBy[key(m.name)]||{};
    return {name:m.name, type:f.type||m.series, sw:f.sw||m.hex||'#888',
      kg:f.kg!=null?+f.kg:0, spools:f.spools||0, owner:f.owner||'',
      min:f.min!=null?+f.min:(m.min!=null?m.min:0.4), note:f.note||m.note||'', id:key(m.name)};
  };
  let master=FIL_CATALOG.map(resolve);
  FIL_EXTRA.forEach(x=>master.push(resolve(x)));
  // append any live spools not already represented (custom entries)
  Object.values(liveBy).forEach(f=>{
    const n=f.name||(f.material?String(f.material)+(f.color?' '+f.color:''):'');
    if(n&&!master.some(r=>r.name===n))master.push(resolve({name:n,series:f.type||'',hex:f.sw||'#888',min:f.min}));
  });
  master.sort((a,b)=>String(a.name).localeCompare(String(b.name)));
  const maxKg=Math.max(...master.map(r=>r.kg),1);
  const totKg=master.reduce((a,r)=>a+r.kg,0);
  const outAll=master.filter(r=>r.kg<=0).length;
  const lowAll=master.filter(r=>r.kg>0&&r.kg<r.min).length;
  const jK=master.filter(r=>r.owner==='J').reduce((a,r)=>a+r.kg,0);
  const bK=master.filter(r=>r.owner==='B').reduce((a,r)=>a+r.kg,0);
  const eur=kg=>'€'+(kg*EUR_PER_KG).toFixed(2);
  const stat=(k,v,n,cls='')=>`<div class="stat ${cls}"><div class="k">${k}</div><div class="v">${v}</div><div class="n">${n}</div></div>`;

  const lvlColor=r=>r.kg<r.min?'var(--bad)':r.kg<r.min*2?'var(--warn)':'var(--ok)';

    if(hideEmpty&&r.kg<=0)return false;

        ${FIL_RECEIVED.includes(x.name)?'':'<button class="btn ghost" style="padding:2px 8px;font-size:11px;margin-top:4px" onclick="filRecv(${JSON.stringify(x.name)})">✔ receive</button>'}</div>`).join('')}

window.filLog=async()=>{
  const id=document.getElementById('fm-col').value,type=document.getElementById('fm-type').value;
  const g=+document.getElementById('fm-g').value||0,who=document.getElementById('fm-who').value;
  const note=document.getElementById('fm-note').value.trim();
  if(!g)return alert('grams required, kid.');
  const metaKey=id; // master ids are already name-safe keys
  const catMeta=FIL_CATALOG.find(c=>String(c.name).replace(/[^\w ]/g,'')===metaKey)||FIL_EXTRA.find(c=>String(c.name).replace(/[^\w ]/g,'')===metaKey);
  const live=state.filament[id]||{};
  const name=live.name||catMeta?live.name||(catMeta&&catMeta.name):id;
  const cur=+(live.kg)||0;
  const delta=type==='use'?-g:g;
  const nk=Math.max(0,Math.round((cur+delta/1000)*1000)/1000);
  const verbs={use:'used on print',add:'stock top-up',buy:'new stock added',new:'new spool in — first entry',xfer:'transferred'};
  try{
    if(!live.name&&catMeta){
      await upd('filament/'+metaKey,{name:catMeta.name,type:catMeta.series,sw:catMeta.hex,kg:0,spools:0,owner:who,min:0.4});
    }
    await upd('filament/'+metaKey,{kg:nk});
    await add('fmoves',{d:new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short'}),who,
      what:`${verbs[type]} — ${name}${note?': '+note:''}`,amt:delta,ts:new Date().toISOString()});
    document.getElementById('fm-g').value='';document.getElementById('fm-note').value='';
  }catch(e){alert('Save failed: '+e.message);}
};

  for(let i=0;i<files.length;i++){
    const f=files[i];prog.textContent=`Uploading ${f.name} (${i+1}/${files.length})…`;
    try{
      const path='files/'+Date.now()+'-'+f.name.replace(/[^\w.\- ]/g,'_');
      const snap=await storage.ref(path).put(f);
      const url=await snap.ref.getDownloadURL();
      await add('files',{name:f.name,size:f.size,path,url,by:me(),created:today()+' '+new Date().toTimeString().slice(0,5)});

function renderStock(){

  for(const c of STOCK_SEED)for(const it of c.items){
    const live=db[it.name];
    lines.push({cat:c.name,price:it.price,name:it.name,qty:live&&live.qty!=null?+live.qty:it.qty});
  }
  for(const[n,v]of Object.entries(db))if(!names.has(n)&&v&&v.qty!=null)lines.push({cat:v.cat||'Uncategorised',price:+v.price||0,name:n,qty:+v.qty});

  const statusOf=l=>l.qty<=0?'out':l.qty<=4?'low':l.qty<10?'warn':'ok';
  const stat=(k,v,n,cls='')=>`<div class="stat ${cls}"><div class="k">${k}</div><div class="v">${v}</div><div class="n">${n}</div></div>`;
  const totU=lines.reduce((s,l)=>s+l.qty,0), totV=lines.reduce((s,l)=>s+l.qty*l.price,0);
  const lowList=lines.filter(l=>l.qty>0&&l.qty<=4);
  const outList=lines.filter(l=>l.qty<=0);
  const maxQty=Math.max(...lines.map(l=>l.qty),1);

    if(curStatus!=='all'&&statusOf(l)!==curStatus)return false;
    return true;

    </td>
  </tr>`).join('')}
  </tbody></table></div>
  <div class="grid2">
    <div class="panel"><h3>Export</h3>
      <button class="btn ghost" onclick="exportStock()">⬇ export CSV</button>
      <div class="muted" style="font-size:11.5px;margin-top:8px">Full ledger snapshot with a date stamp — hand it to Gerry or keep for records.</div>
    </div>
    <div class="panel"><h3>About</h3>
      <div class="muted" style="font-size:12px">Seeded from Gerry's 2026-08-30 stock take (1,645 units / £13,671.50). Every −1/+1/set writes live to the shared ledger — the same numbers Gerry's agents read via the API. Sold-out lines are hidden by default; untick to see the gaps.</div>

  return html;
}
window.stFilter=(k,v)=>{
  if(k==='hideOut'){localStorage.setItem('st_hideOut',v?'1':'0');}
  else localStorage.setItem('st_'+k,v);
  render();
};
const sqKey=n=>'sq-'+n.replace(/[^\w]/g,'_');
window.bumpStock=(n,d)=>{const l=[...document.querySelectorAll('.card h3')].find(h=>h.textContent===n);void l;
  const cur=(state.stock&&state.stock[n]&&state.stock[n].qty!=null)?+state.stock[n].qty:(STOCK_SEED.flatMap(c=>c.items).find(i=>i.name===n)||{}).qty||0;
  up('stock/'+encodeURIComponent(n),{qty:Math.max(0,cur+d)}).catch(e=>alert('Save failed: '+e.message));};
window.setQty=n=>{const el=document.getElementById(sqKey(n));const v=+el.value;if(isNaN(v)||v<0)return alert('Valid number, kid.');
  up('stock/'+encodeURIComponent(n),{qty:v}).catch(e=>alert('Save failed: '+e.message));};
window.exportStock=()=>{
  const rows=[['category','item','qty','unit price','line value']];
  const db=state.stock||{};
  for(const c of STOCK_SEED)for(const it of c.items){const q=db[it.name]&&db[it.name].qty!=null?db[it.name].qty:it.qty;rows.push([c.name,it.name,q,it.price,(q*it.price).toFixed(2)]);}
  const csv=rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'}),u=URL.createObjectURL(blob),el=document.createElement('a');
  el.href=u;el.download='stock-'+new Date().toISOString().slice(0,10)+'.csv';el.click();URL.revokeObjectURL(u);};

  const open=rows.filter(([,e])=>e.status==='new'),done=rows.filter(([,e])=>e.status!=='new');
  const card=([id,e])=>`<div class="note"><b>${esc(e.name)}</b> <span class="mut">&lt;${esc(e.email)}&gt;</span>
    <div style="margin:6px 0">${esc(e.msg)}</div>
    <div class="meta"><span>${esc((e.created||'').slice(0,16).replace('T',' '))}</span>
    <span><span class="badge ${e.status==='new'?'b-warn':e.status==='quoted'?'b-info':'b-ok'}">${esc(e.status||'new')}</span>
    ${e.status==='new'?`<button class="btn ghost" style="padding:3px 10px" onclick="up('enquiries/${id}',{status:'quoted'})">mark quoted</button> `:''}
    <button class="btn ghost" style="padding:3px 10px" onclick="del('enquiries/${id}')">✕</button></span></div></div>`;
  let html=tabHead('06','ENQUIRIES','customer quote requests');
  if(!rows.length)html+='<div class="empty">No customer enquiries yet. When the storefront form gets one, it lands here.</div>';
  else{
    html+=`<h3 style="margin:4px 0 10px">New (${open.length})</h3>`+(open.length?open.map(card).join(''):'<div class="empty" style="padding:14px">Inbox zero, kid.</div>');
    if(done.length)html+=`<details style="margin-top:12px"><summary>Handled (${done.length})</summary>${done.map(card).join('')}</details>`;
  }
  return html;
}


/* ---------- christmas countdown board ---------- */
function renderXmas(){
  const db=state.stock||{};
  const lines=XMAS_TARGETS.map(t=>{
    // map "Charizard ball" -> stock key "Charizard" / "Basic Pokéballs" style keys
    const key=Object.keys(db).find(k=>k.toLowerCase()===t.name.replace(' ball','').toLowerCase());
    const have=key&&db[key].qty!=null?+db[key].qty:t.have;
    const need=Math.max(0,t.target-have);
    return {...t,have,need};
  });
  const done=lines.filter(l=>l.need<=0).length;
  const totNeed=lines.reduce((s,l)=>s+l.need,0);
  const totTarget=lines.reduce((s,l)=>s+l.target,0);
  const pct=totTarget?Math.round(((totTarget-totNeed)/totTarget)*100):0;
  const stat=(k,v,n,cls='')=>`<div class="stat ${cls}"><div class="k">${k}</div><div class="v">${v}</div><div class="n">${n}</div></div>`;
  // days to mid-nov
  const now=new Date();
  const target=new Date(now.getFullYear(),10,15);
  if(target<now)target.setFullYear(now.getFullYear()+1);
  const days=Math.ceil((target-now)/86400000);
  const perDay=days>0?(totNeed/days).toFixed(1):'—';
  // blockers: gate analysis from filament (which colours gate which lines) + human blockers
  const gates=[];
  for(const l of lines){
    if(l.need<=0)continue;
    // find filament colours in the note or map to colours of that pokemon ball
    const pokemon=l.name.replace(' ball','');
    const cols=Object.entries(POKEBALL_MAP).filter(([c,balls])=>balls.some(b=>b.toLowerCase().includes(pokemon.toLowerCase()))).map(([c])=>c);
    const shortCols=cols.filter(c=>{const f=Object.values(state.filament||{}).find(x=>x.name===c);return f&&(+f.kg||0)<1;});
    gates.push({name:l.name,need:l.need,human:l.note||'',fil:shortCols});
  }
  let html=tabHead('10','CHRISTMAS','season target tracker — mid-Nov')+`<div class="stats">
    ${stat('Days to season',days,'mid-Nov 15','warn')}
    ${stat('Units to print',totNeed,perDay+' /day to hit target','warn')}
    ${stat('Progress',pct+'%',totTarget+' target units')}
    ${stat('Lines done',done+' /'+lines.length,'at target')}
  </div>
  <div class="tbl-wrap"><table><thead><tr>
    <th>Line</th><th style="text-align:right">Have</th><th style="text-align:right">Target</th><th style="text-align:right">To print</th><th>Progress</th><th>Gated by</th>
  </tr></thead><tbody>
  ${lines.map(l=>{
    const pctL=Math.min(100,Math.round(l.have/l.target*100));
    const col=l.need<=0?'var(--ok)':pctL<40?'var(--bad)':pctL<70?'var(--warn)':'var(--ok)';
    const g=gates.find(g=>g.name===l.name);
    return `<tr>
      <td><b>${esc(l.name)}</b>${l.note?`<div class="muted" style="font-size:11px">${esc(l.note)}</div>`:''}</td>
      <td class="num">${l.have}</td>
      <td class="num">${l.target}</td>
      <td class="num"><b style="color:${l.need<=0?'var(--ok)':'var(--warn)'}">${l.need}</b></td>
      <td><span class="lvbar"><i style="width:${pctL}%;background:${col}"></i></span><span class="pct">${pctL}%</span></td>
      <td class="muted" style="white-space:normal;max-width:260px">${g&&g.fil.length?'⚠ filament: '+esc(g.fil.join(', ')):''}${g&&g.human?(g.fil.length?' · ':'')+esc(g.human):''}</td>
    </tr>`;}).join('')}
  </tbody></table></div>
  <div class="grid2">
    <div class="panel"><h3>Printing priority (from the plan)</h3>
      <div class="muted" style="font-size:12.5px;line-height:1.8">
      1. Gastly ×17, Gengar ×18, Haunter ×20 — P1 trio, fast sellers<br>
      2. Charizard ×9 — slow (7.5h each), start nights<br>
      3. Niche top-ups ×50 — A1 + Lego between batches<br>
      4. Hueforge KC ×100+ — continuous filler, highest £/hr<br>
      5. Eevee-line ×32 — the moment files land (bundle deadline)</div>
    </div>
    <div class="panel"><h3>Human blockers</h3>
      <div class="muted" style="font-size:12.5px;line-height:1.8">
      <b>Ben:</b> Eevee ball file (bundle hinges on it), Raichu, Charmeleon, Mew Blue, Magmar, Weezing, Zubat, Ekans<br>
      <b>James:</b> Glaceon, Sylveon, Squirtle, Darkrai, Snorlax files<br>
      <b>Ben:</b> LED modules ×30–50 before Temu flash price ends<br>
      <b>Slice:</b> Blastoise Hueforge, Mini Rex, Labubu, Skull Statue</div>
    </div>
  </div>`;
  return html;
}

function renderQueue(){
  const rows=Object.entries(state.queue||{}).map(([id,q])=>({id,...q}));
  const sortQ={'queued':0,'printing':1,'done':2};
  rows.sort((a,b)=>(sortQ[a.status]??9)-(sortQ[b.status]??9)||(a.printer||'').localeCompare(b.printer||''));
  const open=rows.filter(r=>r.status!=='done'), done=rows.filter(r=>r.status==='done');
  const perPrinter={};
  PRINTERS.forEach(p=>perPrinter[p]=open.filter(r=>r.printer===p&&r.status==='printing'));
  const stat=(k,v,n,cls='')=>`<div class="stat ${cls}"><div class="k">${k}</div><div class="v">${v}</div><div class="n">${n}</div></div>`;
  let html=tabHead('11','QUEUE','who prints what, on which machine')+`<div class="stats">

    ${stat('Printing now',open.filter(r=>r.status==='printing').length,'of '+PRINTERS.length+' printers','ok')}
    ${stat('Idle printers',(PRINTERS.length-open.filter(r=>r.status==='printing').length),'machines free',open.filter(r=>r.status==='printing').length<PRINTERS.length?'warn':'')}

          <div class="actions"><button onclick="setQ('${active.id}','done')">✔ done</button></div>`
        :'<span class="flag ok">IDLE</span>'}
      </div>`;}).join('')}
  </div>
  ${open.length?'<h3 style="margin:4px 0 10px">Queue</h3><div class="tbl-wrap"><table><thead><tr><th>What</th><th>Printer</th><th>Assigned</th><th>ETA</th><th>Status</th><th></th></tr></thead><tbody>'
    +open.map(r=>`<tr><td><b>${esc(r.what)}</b></td><td>${esc(r.printer||'—')}</td><td>${esc(r.who||'')}</td><td>${esc(r.eta||'—')}</td>
    <td><span class="badge ${r.status==='printing'?'b-info':'b-warn'}">${esc(r.status)}</span></td>
    <td class="num">
      ${r.status==='queued'?`<button class="stbtn" onclick="setQ('${r.id}','printing')">▶ start</button>`:''}
      ${r.status==='printing'?`<button class="stbtn" onclick="setQ('${r.id}','done')">✔ done</button>`:''}
      <button class="stbtn" onclick="del('queue/${r.id}')">✕</button>

/* ---------- filament reorder alerts (computed on filament render) ---------- */
function filAlerts(){
  const rows=Object.values(state.filament||{});
  const low=rows.filter(f=>((+f.kg||0))>0&&(+f.kg||0)<(+f.min||0.4));
  const out=rows.filter(f=>!(+f.kg||0));
  const combined=rows.filter(f=>((+f.kg||0)>0&&(+f.kg||0)<1));
  let html='';
  if(out.length)html+=`<div class="note" style="border-color:var(--bad)"><b>⚠ EMPTY (${out.length}):</b> ${esc(out.map(f=>f.name).join(', '))} — reorder now</div>`;
  if(low.length)html+=`<div class="note" style="border-color:var(--warn)"><b>⚑ LOW (${low.length}):</b> ${esc(low.map(f=>f.name+' ('+(+f.kg).toFixed(2)+'kg)').join(', '))}</div>`;
  if(combined.length)html+=`<div class="note" style="border-color:var(--acc)"><b>◆ Combined &lt;1kg (${combined.length}):</b> ${esc(combined.map(f=>f.name).join(', '))} — one good print away from empty</div>`;
  return html;
}

function filCost(grams){return grams*EUR_PER_KG/1000;} // £ per print


/* ---------- cost & profit tracker ---------- */
function renderCosts(){
  const live=state.costs||{};   // manual overrides by product name
  const lines=COST_SEED.map(c=>{
    const o=live[c.name]||{};
    return {...c, price:o.price!=null?+o.price:c.price, min:o.min!=null?+o.min:c.min,
      grams:o.grams!=null?+o.grams:c.grams, hidden:o.hidden};
  }).filter(c=>!c.hidden);
  const fmt=v=>'£'+(+v).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});
  const pph=c=>{
    if(!c.price||!c.min)return null;
    const fil=c.grams?c.grams*EUR_PER_KG/1000:0;
    return {margin:c.price-fil, hr:c.min/60, pph:(c.price-fil)/(c.min/60)};
  };
  const withPph=lines.map(c=>({...c,calc:pph(c)})).filter(c=>c.calc);
  const best=[...withPph].sort((a,b)=>b.calc.pph-a.calc.pph);
  const avgPph=withPph.length?(withPph.reduce((s,c)=>s+c.calc.pph,0)/withPph.length):0;
  const stat=(k,v,n,cls='')=>`<div class="stat ${cls}"><div class="k">${k}</div><div class="v">${v}</div><div class="n">${n}</div></div>`;
  let html=tabHead('12','COSTS','profit per print-hour by product')+`<div class="stats">
    ${stat('Best £/hr',best.length?'£'+best[0].calc.pph.toFixed(2):'—',best.length?esc(best[0].name):'','ok')}
    ${stat('Average £/hr','£'+avgPph.toFixed(2),withPph.length+' products costed')}
    ${stat('Filament rate','€11.50/kg','all maths uses this')}
    ${stat('Most profitable hour','€'+((best[0]?best[0].calc.pph:0)*8).toFixed(0),best[0]?'8hrs of '+esc(best[0].name.slice(0,18)):'')}
  </div>
  <div class="tbl-wrap"><table><thead><tr>
    <th>Product</th><th>Category</th><th style="text-align:right">Print min</th><th style="text-align:right">Filament g</th><th style="text-align:right">Fil £</th><th style="text-align:right">Price</th><th style="text-align:right">Margin</th><th style="text-align:right">£ / hr</th>
  </tr></thead><tbody>
  ${best.map(c=>`<tr>
    <td><b>${esc(c.name)}</b></td>
    <td class="muted">${esc(c.cat)}</td>
    <td class="num">${c.min||'—'}</td>
    <td class="num">${c.grams||'—'}</td>
    <td class="num">${c.grams?fmt(c.grams*EUR_PER_KG/1000):'—'}</td>
    <td class="num">${c.price?fmt(c.price):'—'}</td>
    <td class="num" style="color:${c.calc.margin<2?'var(--warn)':'var(--ok)'}">${fmt(c.calc.margin)}</td>
    <td class="num"><b style="color:${c.calc.pph>=10?'var(--ok)':c.calc.pph>=5?'var(--warn)':'var(--mut)'}">£${c.calc.pph.toFixed(2)}</b></td>
  </tr>`).join('')}
  </tbody></table></div>
  <div class="grid2">
    <div class="panel"><h3>What this says</h3>
      <div class="muted" style="font-size:12px;line-height:1.8">
      <b style="color:var(--ok)">Green (≥£10/hr)</b>: prioritise — Hueforge Encounters and quick balls dominate.<br>
      <b style="color:var(--warn)">Amber (£5–10/hr)</b>: fine as filler between long runs.<br>
      <b style="color:var(--mut)">Grey (&lt;£5/hr)</b>: only print when stock-out forces it or as bundle parts.<br>
      Margin = price − filament at €11.50/kg. Labour not costed — you'd be printing anyway.</div>
    </div>
    <div class="panel"><h3>Top 5 by £/hr</h3>
      <div class="muted" style="font-size:12.5px;line-height:1.9">
      ${best.slice(0,5).map((c,i)=>`${i+1}. <b>${esc(c.name)}</b> — £${c.calc.pph.toFixed(2)}/hr`).join('<br>')}</div>
    </div>
  </div>`;
  return html;
}

/* ---------- ops bot (tier 1: rule-based, DB-native) ---------- */
function bPush(msg,cls){const log=$('botlog');const d=document.createElement('div');d.className='bmsg '+(cls||'bot');d.innerHTML=msg;log.appendChild(d);log.scrollTop=log.scrollHeight;}
function botLog(){return (state.botlog||[]);}

function renderBot(){
  let html=tabHead('13','OPS BOT','rule-based — reads the ledger, logs what you say')+`<div class="botwrap">
    <div class="botlog" id="botlog"></div>
    <div class="bbar"><input id="b-in" placeholder="Ask: how much desert tan? / what's low? / log delivery of Charcoal 8kg" onkeydown="if(event.key==='Enter')botAsk()"><button class="btn" onclick="botAsk()">Send</button></div>
    <div class="bchips">
      <span class="bchip" onclick="botChip('what filament is low?')">what's low?</span>
      <span class="bchip" onclick="botChip('how much charcoal black do we have?')">how much charcoal?</span>
      <span class="bchip" onclick="botChip('stock summary')">stock summary</span>
      <span class="bchip" onclick="botChip('how many pikachu are left?')">pikachu stock?</span>
      <span class="bchip" onclick="botChip('help')">help</span>
    </div>
    <div class="mut" style="margin-top:8px">Reads are live from the database. Logging deliveries/expenses requires you to be logged in — writes are attributed to you. No AI key involved: pure pattern-matching on the ledger.</div>
  </div>`;
  return html;
}

function botFmtFil(){
  const rows=Object.values(state.filament||{}).map(f=>({name:f.name,kg:+f.kg||0,min:+f.min||0.4,owner:f.owner}));
  const total=rows.reduce((s,r)=>s+r.kg,0);
  const low=rows.filter(r=>r.kg>0&&r.kg<r.min);
  const out=rows.filter(r=>r.kg<=0);
  return {rows,total,low,out};
}
function botFmtStock(){
  const db=state.stock||{};
  const seedIdx={};STOCK_SEED.forEach(c=>c.items.forEach(i=>seedIdx[i.name.toLowerCase()]={cat:c.name,price:i.price,seedQty:i.qty}));
  return Object.keys(db).map(k=>({name:k,qty:+db[k].qty||0,...(seedIdx[k.toLowerCase()]||{})}));
}
function botFindFil(q){
  const rows=Object.values(state.filament||{});
  const words=q.toLowerCase().split(/[^a-z+]+/).filter(w=>w.length>2);
  return rows.filter(f=>words.some(w=>f.name.toLowerCase().includes(w)));
}
function botFindStock(q){
  const all=botFmtStock();
  const words=q.toLowerCase().split(/[^a-z0-9]+/).filter(w=>w.length>2);
  return all.filter(s=>words.some(w=>s.name.toLowerCase().includes(w)));
}

window.botAsk=async()=>{
  const inp=$('b-in');const q=inp.value.trim();if(!q)return;
  inp.value='';
  if(!botLog().length){bPush('<b>OPS BOT</b> — online. I read stock, filament, targets and can log deliveries/expenses if you\'re logged in. Type <b>help</b> for what I understand.','bot');}
  bPush(esc(q),'user');
  setTimeout(async()=>{ try{ await botRoute(q.toLowerCase()); }catch(e){ bPush('⚠ '+esc(e.message||e),'err'); } },80);
};

async function botRoute(q){
  const num=(re)=>{const m=q.match(re);return m?parseFloat(m[1]):null;};
  const money=(re)=>{const m=q.match(re);return m?parseFloat(m[1]):null;};

  // ---------- HELP ----------
  if(/^(help|what can you do|commands)/.test(q)){
    return bPush(`I understand:\n• <b>how much [colour]?</b> — filament kg on hand\n• <b>what's low / what's empty?</b> — reorder alerts\n• <b>stock summary</b> — units + value\n• <b>how many [product]?</b> — finished goods\n• <b>log delivery of [filament] Nkg</b> — add incoming to stock\n• <b>log expense £N for [thing]</b> — expense note\n• <b>print targets</b> — christmas countdown\n• <b>best earners</b> — £/hr leaderboard`);
  }
  // ---------- FILAMENT: low / empty ----------
  if(/low|empty|reorder|running out/.test(q)){
    const f=botFmtFil();
    let out='';
    if(f.out.length)out+='<b>EMPTY:</b> '+f.out.map(r=>esc(r.name)).join(', ')+'\n';
    if(f.low.length)out+='<b>LOW (below floor):</b> '+f.low.map(r=>esc(r.name)+' ('+r.kg.toFixed(2)+'kg)').join(', ')+'\n';
    if(!out)out='Nothing low — shelf looks healthy.';
    return bPush(out);
  }
  // ---------- filament amount ----------
  const filQ=botFindFil(q);
  if(filQ.length&&/how much|kg|left|have/.test(q)){
    return bPush(filQ.map(f=>`<b>${esc(f.name)}</b>: ${(+f.kg||0).toFixed(2)} kg (${f.spools||1} spool${(f.spools||1)>1?'s':''})${(+f.kg||0)<(+f.min||0.4)?' — ⚠ below floor':''}`).join('\n'));
  }
  // ---------- stock: how many ----------
  const stQ=botFindStock(q);
  if(stQ.length&&/how many|stock|left|have/.test(q)){
    return bPush(stQ.map(s=>`<b>${esc(s.name)}</b>: ${s.qty} units${s.price?' · £'+s.price+' each':''}`).join('\n'));
  }
  // ---------- stock summary ----------
  if(/stock summary|summary|total stock|stock value/.test(q)){
    const all=botFmtStock();
    const u=all.reduce((s,r)=>s+r.qty,0);
    const v=all.reduce((s,r)=>s+r.qty*(r.price||0),0);
    return bPush(`<b>${u}</b> units across ${all.length} lines · value <b>£${v.toLocaleString('en-GB',{minimumFractionDigits:2})}</b> (at Gerry's prices)\nBaseline: 1,645 units / £13,671.50`);
  }
  // ---------- print targets ----------
  if(/target|christmas|countdown|print.*plan/.test(q)){
    const db=state.stock||{};
    const lines=XMAS_TARGETS.map(t=>{
      const key=Object.keys(db).find(k=>k.toLowerCase()===t.name.replace(' ball','').toLowerCase());
      const have=key&&db[key].qty!=null?+db[key].qty:t.have;
      return `<b>${esc(t.name)}</b>: ${have}/${t.target} — ${Math.max(0,t.target-have)} to print${t.note?' · '+esc(t.note):''}`;
    });
    return bPush(lines.join('\n'));
  }
  // ---------- best earners ----------
  if(/best|earner|profit|£\/hr|pph/.test(q)){
    const withP=COST_SEED.filter(c=>c.pph_calc);
    const top=[...withP].sort((a,b)=>b.pph_calc-a.pph_calc).slice(0,5);
    return bPush('Top 5 by £/hr:\n'+top.map((c,i)=>`${i+1}. <b>${esc(c.name)}</b> — £${c.pph_calc.toFixed(2)}/hr`).join('\n'));
  }
  // ---------- LOG DELIVERY ----------
  const dm=q.match(/log (delivery|incoming|received)\s+(?:of\s+)?(.+?)\s+([\d.]+)\s*kg/);
  if(dm){
    if(!firebase.auth().currentUser)return bPush('⚠ Log in first — deliveries are attributed to you.','err');
    const name=dm[2].trim(),kg=parseFloat(dm[3]);
    const key=Object.keys(state.filament||{}).find(k=>k.toLowerCase().includes(name.toLowerCase()));
    if(!key)return bPush(`No filament matching "${esc(name)}" in the ledger. Exact name? (check the Filament tab)`,'err');
    const f=state.filament[key];
    const newKg=Math.round(((+f.kg||0)+kg)*1000)/1000, newSp=(+f.spools||0)+Math.round(kg);
    await upd('filament/'+key,{kg:newKg,spools:newSp});
    await add('fmoves',{d:new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short'}),who:me(),
      what:`received incoming — ${f.name} (+${kg}kg, via bot)`,amt:Math.round(kg*1000),ts:new Date().toISOString()});
    return bPush(`✓ <b>${esc(f.name)}</b> +${kg}kg → now ${newKg.toFixed(2)} kg (${newSp} spools). Logged by ${me()}.`);
  }
  // ---------- LOG EXPENSE ----------
  const em=q.match(/log (expense|cost)\s+(?:of\s+)?£?\s*([\d.]+)\s*(?:for|on)\s+(.+)/);
  if(em){
    if(!firebase.auth().currentUser)return bPush('⚠ Log in first — expenses are attributed to you.','err');
    const amt=parseFloat(em[2]), what=em[3].trim();
    await add('expenses',{what,amount:amt,by:me(),created:new Date().toISOString()});
    return bPush(`✓ Expense logged: <b>£${amt.toFixed(2)}</b> — ${esc(what)} (by ${me()})`);
  }
  // ---------- greeting / fallback ----------
  if(/^(hi|hello|hey|yo)/.test(q))return bPush('Yo. Ask me about stock or filament, or type <b>help</b>.');
  return bPush(`Didn't catch that. I understand things like:\n• <b>how much desert tan?</b>\n• <b>what's low?</b>\n• <b>how many pikachu?</b>\n• <b>log delivery of Charcoal 8kg</b>\n• <b>log expense £25 for LED modules</b>\nType <b>help</b> for the full list.`);
}
